; Castlevania: Lords of Shadow - Mirror of Fate (USA)
; Copy to <emulator-user-data>/GameSettings/0004000000096600.ini.
; Restart emulation after changing this preset.

[Core]
cpu_clock_percentage = 100

[Renderer]
graphics_api = 2
resolution_factor = 2
pp_shader_name = None (builtin)
texture_filter = 0
texture_sampling = 0
shaders_accurate_mul = true
render_3d = 0
use_frame_limit = true
frame_limit = 100
disable_game_post_fx = false
simulate_3ds_gpu_timings = true
async_shader_compilation = false
; Thor-tested GSP render-thread yield: continuous walking at about 30 game FPS.
delay_game_render_thread_us = 3000
