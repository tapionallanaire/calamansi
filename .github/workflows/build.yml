name: Calamansi Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.30.3' 'ndk;27.3.13750724'
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ccache ninja-build
          printf 'sdk.dir=%s\ncmake.dir=%s\n' "$ANDROID_HOME" "$ANDROID_HOME/cmake/3.30.3" > src/android/local.properties
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('src/android/gradle/wrapper/gradle-wrapper.properties', 'src/android/**/*.gradle.kts', 'src/android/gradle.properties') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - name: Cache native compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: android-native-${{ runner.os }}-ndk27.3-cmake3.30.3-${{ github.sha }}
          restore-keys: android-native-${{ runner.os }}-ndk27.3-cmake3.30.3-
      - name: Build signed main or release APKs
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/calamansi-signing.jks
        run: |
          if [[ -z "$ANDROID_KEYSTORE_B64" || -z "$ANDROID_KEYSTORE_PASS" || -z "$ANDROID_KEY_ALIAS" ]]; then
            echo '::error::Main and version-tag builds require all three Android signing secrets.'
            exit 1
          fi
          umask 077
          trap 'rm -f -- "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          unset ANDROID_KEYSTORE_B64
          bash .ci/android.sh
      - name: Build unsigned-trust preview APKs with temporary debug signer
        if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
        run: bash .ci/android.sh
      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/calamansi-signing.jks"
      - name: Verify and collect the two APKs
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p artifacts
          declare -a variants=(fatesFix release)
          declare -a packages=(org.azahar_emu.azahar.fatesfix org.azahar_emu.azahar)
          declare -a names=(calamansi-android.apk calamansi-android-original-package.apk)
          previous_certificate=''
          for i in "${!variants[@]}"; do
            apks=(src/android/app/build/outputs/apk/vanilla/"${variants[$i]}"/*.apk)
            [[ ${#apks[@]} -eq 1 && -f "${apks[0]}" ]]
            apk="${apks[0]}"
            unzip -tq "$apk"
            signature="$("$tools/apksigner" verify --verbose --print-certs "$apk")"
            printf '%s\n' "$signature"
            certificate="$(printf '%s\n' "$signature" | grep '^Signer #1 certificate SHA-256 digest: ')"
            [[ -n "$certificate" ]]
            if [[ -n "$previous_certificate" ]]; then
              [[ "$certificate" == "$previous_certificate" ]]
            fi
            previous_certificate="$certificate"
            badging="$("$tools/aapt" dump badging "$apk")"
            printf '%s\n' "$badging" | grep -F "package: name='${packages[$i]}' "
            printf '%s\n' "$badging" | grep -Fx "application-label:'Calamansi'"
            printf '%s\n' "$badging" | grep -Fx "native-code: 'arm64-v8a' 'x86_64'"
            if printf '%s\n' "$badging" | grep -q '^application-debuggable'; then
              echo '::error::A distribution APK must not be debuggable.'
              exit 1
            fi
            cp -- "$apk" "artifacts/${names[$i]}"
          done
          (cd artifacts && sha256sum calamansi-android.apk calamansi-android-original-package.apk > SHA256SUMS)
      - name: Upload verified Android artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: calamansi-android
          path: |
            artifacts/calamansi-android.apk
            artifacts/calamansi-android-original-package.apk
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.android.outputs.artifact-id }}
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          ## Android / Thor preview

          Full device acceptance checks are incomplete. These APKs have CI signature, ZIP CRC, package, label, nondebuggable and ABI checks; that does not establish a hardware/runtime pass. Back up your user folder before installing.

          - `calamansi-android.apk`: `org.azahar_emu.azahar.fatesfix`, the primary side-by-side Thor package.
          - `calamansi-android-original-package.apk`: `org.azahar_emu.azahar`, the original-package variant. Installing over another build requires matching signing identity; this fork is not signed by upstream Azahar.
          - `SHA256SUMS`: SHA-256 checksums for both APKs.

          Both display Calamansi and share the existing user-data formats and paths. Select your existing user folder to reuse saves and textures; the Thor folder remains `/sdcard/citra-emu`. Side-by-side packages do not isolate data when they select the same folder. Avoid simultaneous writes and keep backups.

          Native source revision identity and strict savestate guards are unchanged. Builds from this new repository have their actual new commit identity: savestates from earlier builds may be rejected for a version mismatch. Use ordinary in-game saves for migration.
          NOTES
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" --verify-tag \
            --title "Calamansi $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" \
            "${flags[@]}" \
            artifacts/calamansi-android.apk \
            artifacts/calamansi-android-original-package.apk \
            artifacts/SHA256SUMS
